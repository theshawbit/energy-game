# v5.3 "Integrity" — the one place the project's no-CI discipline is reversed, and only for
# TESTS. Runs the module suites AND the asserting harness (tests/harness.test.mjs, via `npm test`)
# on every push and PR, so a change can't land with a red suite or a broken economy incentive.
# There is no build step and no deploy here: GitHub Pages is still published by hand from `main`.
name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
